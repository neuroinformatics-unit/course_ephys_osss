<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Arial, sans-serif">
  <!-- value label -->
  <text x="360" y="24" text-anchor="middle" font-size="20" fill="#222">
    <tspan font-weight="bold">1234</tspan>
    <tspan dx="6">=</tspan>
    <tspan dx="6">2 + 16 + 64 + 128 + 1024</tspan>
  </text>

  <!-- Low byte : place values 1 .. 128 -->
  <g>
    <text x="57"  y="52" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="95"  y="52" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="133" y="52" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="171" y="52" text-anchor="middle" font-size="11" fill="#555">8</text>
    <text x="209" y="52" text-anchor="middle" font-size="11" fill="#555">16</text>
    <text x="247" y="52" text-anchor="middle" font-size="11" fill="#555">32</text>
    <text x="285" y="52" text-anchor="middle" font-size="11" fill="#555">64</text>
    <text x="323" y="52" text-anchor="middle" font-size="11" fill="#555">128</text>
    <rect x="40"  y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="78"  y="60" width="34" height="34" fill="#4c78a8" stroke="#333" stroke-width="1.5"/>
    <rect x="116" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="154" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="192" y="60" width="34" height="34" fill="#4c78a8" stroke="#333" stroke-width="1.5"/>
    <rect x="230" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="268" y="60" width="34" height="34" fill="#4c78a8" stroke="#333" stroke-width="1.5"/>
    <rect x="306" y="60" width="34" height="34" fill="#4c78a8" stroke="#333" stroke-width="1.5"/>
    <text x="57"  y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="95"  y="83" text-anchor="middle" font-size="18" fill="#ffffff">1</text>
    <text x="133" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="171" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="209" y="83" text-anchor="middle" font-size="18" fill="#ffffff">1</text>
    <text x="247" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="285" y="83" text-anchor="middle" font-size="18" fill="#ffffff">1</text>
    <text x="323" y="83" text-anchor="middle" font-size="18" fill="#ffffff">1</text>
    <text x="190" y="122" text-anchor="middle" font-size="16" fill="#555">low byte</text>
  </g>

  <!-- High byte : place values 256 .. 32768 -->
  <g>
    <text x="381" y="52" text-anchor="middle" font-size="11" fill="#555">256</text>
    <text x="419" y="52" text-anchor="middle" font-size="11" fill="#555">512</text>
    <text x="457" y="52" text-anchor="middle" font-size="11" fill="#555">1024</text>
    <text x="495" y="52" text-anchor="middle" font-size="11" fill="#555">2048</text>
    <text x="533" y="52" text-anchor="middle" font-size="11" fill="#555">4096</text>
    <text x="571" y="52" text-anchor="middle" font-size="11" fill="#555">8192</text>
    <text x="609" y="52" text-anchor="middle" font-size="11" fill="#555">16384</text>
    <text x="647" y="52" text-anchor="middle" font-size="11" fill="#555">32768</text>
    <rect x="364" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="402" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="440" y="60" width="34" height="34" fill="#4c78a8" stroke="#333" stroke-width="1.5"/>
    <rect x="478" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="516" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="554" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="592" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="630" y="60" width="34" height="34" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="381" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="419" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="457" y="83" text-anchor="middle" font-size="18" fill="#ffffff">1</text>
    <text x="495" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="533" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="571" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="609" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="647" y="83" text-anchor="middle" font-size="18" fill="#222">0</text>
    <text x="514" y="122" text-anchor="middle" font-size="16" fill="#555">high byte</text>
  </g>

  <text x="360" y="160" text-anchor="middle" font-size="15" fill="#777">
    16 bits = 2 bytes  ·  one square = one bit  ·  numbers above = place value
  </text>
</svg>
