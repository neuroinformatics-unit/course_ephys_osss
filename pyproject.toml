[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course_ephys_osss"
description = "Materials for the OSSS Extracellular Ephys 2026 Course."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
    { name = "Joseph Ziminski", email = "j.ziminski@ucl.ac.uk" },
    { name = "Chris Halcrow", email = "c.halcrow@ucl.ac.uk" },
    { name = "Alessio Buccino", email = "alessio.buccino@alleninstitute.org" },
    { name = "Enny H. van Beest", email = "e.beest@ucl.ac.uk" },
    { name = "Olivier Winter", email = "olivier.winter@internationalbrainlab.org" },
    { name = "Wolf De Wulf", email = "wolf.de.wulf@ed.ac.uk" },
]
keywords = ["electrophysiology", "neuroscience", "course", "OSSS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "dandi",
    "hdbscan",
    "ibl-neuropixel",
    "ipykernel",
    "ipympl",
    "ipywidgets",
    "jupyter",
    "kilosort",
    "matplotlib",
    "nbformat",
    "numpy",
    "ONE-api",
    "pandas",
    "probeinterface",
    "pynapple",
    "remfile",
    "scipy",
    "spikeinterface[full,widgets]",
    "pyqtgraph",
    "pynwb",
    "UnitMatchPy[full,notebooks]",
    "spikeinterface-gui",
    "viewephys",
    "pyqt5",
]

[project.urls]
Homepage = "https://neuroinformatics.dev/course-ephys-osss/"
Repository = "https://github.com/neuroinformatics-unit/course-ephys-osss"
Issues = "https://github.com/neuroinformatics-unit/course-ephys-osss/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["course_ephys_osss*"]
[tool.setuptools_scm]

[tool.uv.sources]
spikeinterface-gui = { git = "https://github.com/spikeinterface/spikeinterface-gui" }
